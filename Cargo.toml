[package]
name = "reaper-datasource"
version = "0.1.0"
edition = "2021"
description = "Tabular data (spreadsheet/CSV) parsing API for REAPER ReaScripts"
license = "MIT"
repository = "https://github.com/TeamAudio/reaper-datasource"

[lib]
name = "reaper_datasource"
crate-type = ["cdylib"]

[dependencies]
calamine = { version = "0.26", features = ["dates"] }
# calamine enables chrono without its formatting support; "alloc" restores it
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
csv = "1"
quick-xml = "0.37"
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-macros = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs.git", branch = "master" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "0.79"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
strip = "symbols"
